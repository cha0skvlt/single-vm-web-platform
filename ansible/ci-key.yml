---
# CICD-2 — append CI deploy pubkey to deploy@ authorized_keys (exclusive: false).
- name: Install CI deploy SSH public key
  hosts: all
  become: true
  vars:
    ci_deploy_pubkey_file: "{{ playbook_dir }}/../keys/ci_deploy.pub"
  tasks:
    # File check via command (avoids fragile when: on registered stdout).
    - name: Require CI deploy public key on controller
      ansible.builtin.command:
        argv:
          - test
          - -f
          - "{{ ci_deploy_pubkey_file }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false

    - name: Install CI deploy key for admin user
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        key: "{{ lookup('file', ci_deploy_pubkey_file) }}"
        state: present
        exclusive: false
