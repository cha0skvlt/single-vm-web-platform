services:
  traefik:
    image: traefik:v3.7.5
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
      - --certificatesresolvers.le.acme.email=${LE_EMAIL}
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=web
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - docker-socket-proxy
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic
      - ./certs:/etc/traefik/dynamic/certs:ro
      - traefik-acme:/acme
      - /var/log/${PROJECT_HOSTNAME:-prod}/traefik:/var/log/traefik
    networks:
      web:
      platform:
        ipv4_address: 172.28.10.6
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik-prod.rule=Host(`${PROD_PUBLIC_HOST}`) && PathPrefix(`/traefik`)
      - traefik.http.routers.traefik-prod.entrypoints=websecure
      - traefik.http.routers.traefik-prod.tls=true
      - traefik.http.routers.traefik-prod.priority=200
      - traefik.http.routers.traefik-prod.middlewares=prod-session-forward@file,prod-headers@file,strip-traefik-prefix@file
      - traefik.http.routers.traefik-prod.service=api@internal
      # Traefik dashboard JS hardcodes APIURL="/api/" — route /api on the prod host to api@internal
      - traefik.http.routers.traefik-api-prod.rule=Host(`${PROD_PUBLIC_HOST}`) && PathPrefix(`/api`)
      - traefik.http.routers.traefik-api-prod.entrypoints=websecure
      - traefik.http.routers.traefik-api-prod.tls=true
      - traefik.http.routers.traefik-api-prod.priority=200
      - traefik.http.routers.traefik-api-prod.middlewares=prod-session-forward@file,prod-headers@file
      - traefik.http.routers.traefik-api-prod.service=api@internal

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      EVENTS: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - platform
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --path.sysfs=/host/sys
      - --path.procfs=/host/proc
      - --collector.systemd
      - --collector.systemd.unit-include=docker-(.+)\.scope
      - --collector.systemd.unit-exclude=\.slice$
    volumes:
      - /:/host:ro,rslave
      - /run/systemd/private:/run/systemd/private:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
    networks:
      - platform
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  prometheus:
    image: prom/prometheus:v3.12.0
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1536MB
      - --storage.tsdb.wal-compression
      - --query.max-concurrency=4
    depends_on:
      - docker-socket-proxy
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - web
      - platform
      - db
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 640M

  loki:
    image: grafana/loki:3.7.4
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    ports:
      - "${LOKI_INGEST_BIND:-127.0.0.1}:${LOKI_INGEST_PORT:-3100}:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      - platform
    healthcheck:
      # Distroless image (3.6+): no shell/wget — use native loki -health (added in 3.6.5+).
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M

  alloy:
    image: grafana/alloy:v1.17.0
    restart: unless-stopped
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      loki:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /var/log/fail2ban.log:/var/log/fail2ban.log:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - platform
    healthcheck:
      # grafana/alloy image has bash but no wget/curl — probe /-/ready via /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/12345 &&
          printf "GET /-/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          head -1 <&3 | grep -q 200'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 384M

  grafana:
    image: grafana/grafana:11.6.15
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${PROD_PUBLIC_HOST}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_DOMAIN: ${PROD_PUBLIC_HOST}
      GF_SERVER_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_DEFAULT_ROLE: Viewer
      GF_AUTH_PROXY_WHITELIST: 172.28.10.6/32
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_DATABASE_WAL: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_LEVEL: warn
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - platform
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 384M
    labels:
      - traefik.enable=true
      - traefik.docker.network=platform
      - traefik.http.services.grafana.loadbalancer.server.port=3000
      - traefik.http.routers.grafana-prod.rule=Host(`${PROD_PUBLIC_HOST}`) && PathPrefix(`/grafana`)
      - traefik.http.routers.grafana-prod.entrypoints=websecure
      - traefik.http.routers.grafana-prod.tls=true
      - traefik.http.routers.grafana-prod.priority=200
      - traefik.http.routers.grafana-prod.middlewares=prod-session-forward@file,grafana-proxy-user@file,prod-headers@file
      - traefik.http.routers.grafana-prod.service=grafana

  mysql:
    image: mysql:8.4.10
    container_name: mysql
    restart: unless-stopped
    command:
      - --max_allowed_packet=512M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536M

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.17.2
    restart: unless-stopped
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
    networks:
      - db
    depends_on:
      mysql:
        condition: service_healthy
    labels:
      - stack.site=shared
      - stack.role=mysql
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M

  phpmyadmin:
    image: phpmyadmin:5.2.3
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_ARBITRARY: "0"
      PMA_ABSOLUTE_URI: https://${PROD_PUBLIC_HOST}/pma/
      UPLOAD_LIMIT: 512M
      MEMORY_LIMIT: 768M
      MAX_EXECUTION_TIME: "3600"
    networks:
      - platform
      - db
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    labels:
      - traefik.enable=true
      - traefik.docker.network=platform
      - traefik.http.services.phpmyadmin.loadbalancer.server.port=80
      - traefik.http.routers.phpmyadmin-prod.rule=Host(`${PROD_PUBLIC_HOST}`) && PathPrefix(`/pma`)
      - traefik.http.routers.phpmyadmin-prod.entrypoints=websecure
      - traefik.http.routers.phpmyadmin-prod.tls=true
      - traefik.http.routers.phpmyadmin-prod.priority=200
      - traefik.http.routers.phpmyadmin-prod.middlewares=prod-session-forward@file,strip-pma-prefix@file,prod-headers@file
      - traefik.http.routers.phpmyadmin-prod.service=phpmyadmin

networks:
  web:
    external: true
  platform:
    name: platform
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
  db:
    name: db
    driver: bridge
    internal: true

volumes:
  traefik-acme:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
  mysql-data:
