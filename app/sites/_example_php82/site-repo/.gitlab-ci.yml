# Site CD — copy into the site project's .gitlab-ci.yml.
# site-add fills SITE_DOMAIN. Store CI_DEPLOY_KEY as a protected CI variable.
# Push never deploys: press ▶ on deploy_prod.

stages: [deploy]

variables:
  SITE_DOMAIN: "_example.local"
  DEPLOY_HOST: "YOUR_PUBLIC_IP"
  DEPLOY_PORT: "22"
  DEPLOY_USER: "deploy"

deploy_prod:
  stage: deploy
  when: manual
  only: [main]
  image: alpine:3.21
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf '%s\n' "$CI_DEPLOY_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - rsync -az --delete --exclude=.git --exclude=.gitlab-ci.yml --exclude=vendor -e "ssh -p $DEPLOY_PORT"
      ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/prod/var/site-src/$SITE_DOMAIN/"
    - ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST"
      "/opt/prod/scripts/deploy-site.sh --site $SITE_DOMAIN"
